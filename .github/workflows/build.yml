name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: 静态检查
        run: python -m pyflakes app tools tests npm_mirror_tool.py

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 版本号
        run: python npm_mirror_tool.py --version

  build:
    name: 打包 exe
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包
        run: python build.py --no-pause
        env:
          PYTHONIOENCODING: utf-8

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'.'); import app; print(app.APP_VERSION)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 重命名产物
        shell: bash
        run: |
          mkdir -p out
          cp "dist/npm源测速.exe" "out/Quick-npm-ok-v${{ steps.version.outputs.version }}.exe"
          ls -lh out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Quick-npm-ok-v${{ steps.version.outputs.version }}
          path: out/*.exe
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
